<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Início - Gerenciador de Produtos</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <section class="card auth-card home-card">
        <header class="auth-header">
          <h1>Bem-vindo<span id="nome-usuario"></span>!</h1>
          <p class="subtitle">Você está autenticado no sistema.</p>

        <div class="form-actions home-actions">
          <a href="/estoque" id="estoque-btn"
            >Ir para o gerenciamento de estoque</a
          >
          <button type="button" id="logout-btn" class="secondary">Sair</button>
        </div>
      </section>
    </div>

    <script src="auth.js"></script>
  </body>
</html>
